# Final one-shot formatting pass for isolated 0.9.0 beta
name: Temporary feature branch format
on:
  push:
    branches:
      - agent/privacy-gateway-20261020
    paths:
      - .github/workflows/format-feature.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/privacy-gateway-20261020
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write .
      - run: git diff --check
      - name: Commit formatting only to isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format verified privacy gateway branch"
            git push origin HEAD:agent/privacy-gateway-20261020
          fi
