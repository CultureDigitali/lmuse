name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check-chromium-age
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm verify-dist
      - run: pnpm check-size
      - run: pnpm check-links
      - run: pnpm audit --audit-level=high
      - name: secret-scan
        run: |
          ! grep -rEn '(sk-[A-Za-z0-9]{20,}|xox[bap]-|ghp_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,})' src public sidepanel scripts || (echo 'secret-scan: possibile chiave live nel codice' && exit 1)
      - name: no-remote-code
        run: |
          ! grep -rEn '(src|href)="https?://|@import +url\(https?://' src sidepanel public --include='*.ts' --include='*.tsx' --include='*.html' --include='*.css' --include='*.json' | grep -v '\.test\.' || (echo 'no-remote-code: riferimento remoto nel codice' && exit 1)

  e2e:
    runs-on: ubuntu-latest
    env:
      LMUSE_E2E_NATIVE_GRANT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install native UI test driver
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xdotool openbox
      - name: install browser di test
        run: |
          node --input-type=module -e "import {install, Browser} from '@puppeteer/browsers'; import {homedir} from 'node:os'; import {join} from 'node:path'; import {readFileSync} from 'node:fs'; const v = readFileSync('scripts/e2e-smoke.mjs', 'utf8').match(/BROWSER_VERSION = '([^']+)'/)[1]; await install({browser: Browser.CHROME, buildId: v, cacheDir: join(homedir(), '.cache', 'puppeteer')}); console.log('browser', v, 'ok');"
      - name: Run Chrome E2E with a window manager
        run: |
          xvfb-run -a bash -euo pipefail -c '
            openbox >/tmp/lmuse-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            sleep 1
            pnpm test:e2e
          '

  e2e-windows-native:
    # LM-003: a disposable GitHub-hosted Windows VM, never the user's PC.
    # The test registers HKCU only in this throwaway runner and uses fake keys.
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Windows Chrome to native host roundtrip
        env:
          LMUSE_CI_NATIVE_WINDOWS: '1'
        run: node scripts/e2e-native-windows.mjs
