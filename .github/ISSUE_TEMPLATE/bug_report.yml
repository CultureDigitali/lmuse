name: Bug report
description: Segnala un comportamento sbagliato di lmuse
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versione lmuse
      placeholder: es. 0.3.0 (⚙ in fondo al pannello)
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [OpenAI, Anthropic, Google, xAI, Altro, Locale (Ollama/LM Studio)]
  - type: textarea
    id: task
    attributes:
      label: Task che fallisce (senza dati sensibili)
      placeholder: Cosa hai chiesto all'agente?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Cosa succede (copia il messaggio di errore dal pannello)
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Ho rimosso chiavi, email e dati personali dalla segnalazione
          required: true
